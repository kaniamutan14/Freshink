<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>FreshInk</title>
    <meta name="description" content="FreshInk — A premium editorial Progressive Web App client for FreshRSS with beautiful typography, offline sync, and multiple reading themes." />
    <!-- Google Fonts: Editorial Serif and UI Sans-serif -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#FAF6F1" id="meta-theme-color" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Synchronously apply theme before first paint to eliminate cream/white FOUC flash on refresh -->
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('freshink_theme') || 'auto';
          var resolvedTheme = theme;
          if (theme === 'auto') {
            var isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            resolvedTheme = isDark ? 'midnight' : 'parchment';
          }
          document.documentElement.setAttribute('data-theme', resolvedTheme);
          
          // Match address bar background immediately
          var colors = {
            parchment: '#FAF6F1',
            forest: '#F4F6F0',
            midnight: '#1A1814',
            nordic: '#1E222A'
          };
          var metaColor = document.getElementById('meta-theme-color');
          if (metaColor) {
            metaColor.setAttribute('content', colors[resolvedTheme] || '#FAF6F1');
          }
        } catch (e) {
          console.error('Initial theme hydration failed:', e);
        }
      })();
    </script>
    <style>
      /* Statically match background colors immediately based on theme to eliminate dynamic JS/CSS loading flash */
      html[data-theme="parchment"], html:not([data-theme]) { background-color: #FAF6F1; }
      html[data-theme="forest"] { background-color: #F4F6F0; }
      html[data-theme="midnight"] { background-color: #1A1814; }
      html[data-theme="nordic"] { background-color: #1E222A; }
      
      @media (prefers-color-scheme: dark) {
        html[data-theme="auto"] { background-color: #1A1814; }
      }
      @media (prefers-color-scheme: light) {
        html[data-theme="auto"] { background-color: #FAF6F1; }
      }
      
      /* Avoid initial body white flash while main CSS finishes loading */
      body {
        background-color: transparent !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
